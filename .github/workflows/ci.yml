name: Build and test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - run: rustup update stable && rustup default stable && rustup component add clippy

      - name: Build all features
        run: cargo build --workspace --all-features --verbose

      - name: Test all features
        run: cargo test --workspace --all-features --verbose

      - name: Check without rusqlite
        run: cargo check -p powersync --no-default-features

      - name: Check reqwest without rusqlite
        run: cargo check -p powersync --no-default-features --features tokio,reqwest

  musl:
    name: Check musl release features
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install musl target
        run: rustup target add x86_64-unknown-linux-musl

      - name: Check PowerSync crate
        run: cargo check -p powersync --target x86_64-unknown-linux-musl --no-default-features --features tokio,reqwest,rusqlite

  windows:
    name: Check Windows build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install stable Rust
        run: rustup update stable

      - name: Check PowerSync crate
        run: cargo check -p powersync --all-targets --all-features
