[graph]
targets = []
all-features = false

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Zlib",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "CC0-1.0",
    "OFL-1.1",
    "BSL-1.0",
    "OpenSSL",
    "Ubuntu-font-1.0",
]

[[licenses.clarify]]
crate = "powersync"
expression = "Apache-2.0"
license-files = []

[[licenses.clarify]]
crate = "powersync_test_utils"
expression = "Apache-2.0"
license-files = []

[[licenses.clarify]]
crate = "egui_todolist"
expression = "Apache-2.0"
license-files = []

[[licenses.clarify]]
crate = "aws-lc-sys"
expression = "ISC AND (Apache-2.0 OR ISC) AND OpenSSL"
license-files = []

[bans]
multiple-versions = "warn"
wildcards = "allow"

[advisories]
ignore = [
    "RUSTSEC-2023-0018", # remove_dir_all is a test-only tempdir dependency
    "RUSTSEC-2018-0017", # tempdir is test-only and inherited from upstream
    "RUSTSEC-2026-0195", # quick-xml NsReader is build-only via Wayland scanner on trusted XML
    "RUSTSEC-2026-0194", # quick-xml is used only by upstream example desktop build tooling
    "RUSTSEC-2026-0192", # ttf-parser is used only by the upstream egui example
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
